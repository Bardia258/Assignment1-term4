
name: Build and deploy Municipal Elections

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: 'Match Azure App Service Platform: win-x86 = 32 Bit; win-x64 = 64 Bit'
        required: true
        default: win-x86
        type: choice
        options:
          - win-x86
          - win-x64

permissions:
  contents: read

env:
  PROJECT_PATH: COMP4976-MunicipalElections-CSharp/MunicipalElections.Web/MunicipalElections.Web.csproj
  PUBLISH_RUNTIME: ${{ inputs.runtime }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}" --runtime "${{ env.PUBLISH_RUNTIME }}"

      - name: Build application
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --runtime "${{ env.PUBLISH_RUNTIME }}" --self-contained false --no-restore

      - name: Publish application
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --runtime "${{ env.PUBLISH_RUNTIME }}" --self-contained false --no-build --no-restore --output "${{ github.workspace }}/publish"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: municipal-elections-app
          path: publish/

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: municipal-elections-app
          path: publish/

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AE1C739E5991473BB05E83F89415A7E7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C0361A1AC8F54AEBAB2FACE2745DB69A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_288CDDA0B50A4B4CB159169D2876E685 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: municipal-elections
          slot-name: Production
          package: publish/
