
name: Build and deploy Municipal Elections

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_PATH: COMP4976-MunicipalElections-CSharp/MunicipalElections.Web/MunicipalElections.Web.csproj

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore "${{ env.PROJECT_PATH }}"

      - name: Build application
        run: dotnet build "${{ env.PROJECT_PATH }}" --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish "${{ env.PROJECT_PATH }}" --configuration Release --no-restore --output "${{ github.workspace }}/publish"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: municipal-elections-app
          path: publish/

  deploy:
    runs-on: windows-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: municipal-elections-app
          path: publish/

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_AE1C739E5991473BB05E83F89415A7E7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C0361A1AC8F54AEBAB2FACE2745DB69A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_288CDDA0B50A4B4CB159169D2876E685 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: municipal-elections
          slot-name: Production
          package: publish/
